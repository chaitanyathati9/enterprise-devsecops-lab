name: Day 6 Artifacts Workflow

on:
  workflow_dispatch:

jobs:
  create-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Create File
        run: |
          echo "This is a sample artifact content" > artifact.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-artifact
          path: artifact.txt

  download-artifact:
    needs: create-artifact
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: sample-artifact

      - name: Display Artifact
        run: |
          ls -l
          cat artifact.txt